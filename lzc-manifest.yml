application:
  subdomain: zen
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://zen:8080/
services:
  zen:
    # upstream: ghcr.io/sheshbabu/zen/zen:2.0.0
    image: registry.lazycat.cloud/czyt/sheshbabu/zen/zen:42467737899522c3
    environment:
      - DATA_FOLDER=/data
      - IMAGES_FOLDER=/images
      - PORT=8080
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/var/images:/images
